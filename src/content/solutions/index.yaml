hero:
  label_tag: Solutions Techniques
  title: La Technologie au Service de la Pause Parfaite.
  description: >-
    Des distributeurs de dernière génération aux coffee corners sur-mesure, nous
    déployons un parc technique adapté à votre entreprise et à vos
    collaborateurs.
gallery:
  title: Trois gammes, une même exigence de service
  description: >-
    Retrouvez nos principales familles de machines pour l'entreprise. Chaque
    carte ouvre sur une page détaillée avec usages, points forts et type
