vision:
  tag: Notre Vision
  title_line1: Votre machine à café,
  title_line2: C'est le cœur battant de vos bureaux.
  description: >-
    Fini le café avalé dans un couloir. La pause est un moment stratégique celui
    où l'énergie se recharge et où la culture d'entreprise se construit. Chez
    ANS, on aménage cet espace pour qu'il soit à la hauteur.
  cards:
    - title: '"Reset" Sensoriel'
      description: >-
        Une pause réussie mobilise les sens pour couper court à la fatigue. Un
        rituel de déconnexion pour faire chuter la charge mentale et relancer la
        concentration.
    - title: Collisionneur d'Idées
      description: >-
        Les meilleures décisions ne naissent pas toujours en salle de réunion.
        Nos espaces créent des points de rencontres informels qui brisent les
        silos dans l'entreprise.
    - title: Marqueur d'Attention
      description: >-
        Ce que vous glissez dans la tasse de vos équipes en dit long. Une
        expérience digne d'un coffee shop est un levier concret et quotidien de
        Qualité de Vie au Travail.
    - title: Fluidité Invisible
      description: >-
        Pour qu'une pause soit reposante, la logistique doit s'effacer.
        Connexion, entretien préventif et réapprovisionnements : tout est
        anticipé sans que vous n'y pensiez.
services:
  tag: Notre Savoir-Faire
  title: L'Excellence de la Pause Café.
  description: >-
    Des équipements de pointe pilotés par une équipe humaine dédiée. La
    technologie au service de l'humain.
  rows:
    - title: Coffee Corners
      description: >-
        Home staging : une mise en valeur de l'espace de pause par un
        aménagement subtil et chaleureux de l'espace.
    - title: Disponibilité Totale
      description: >-
        Notre promesse : une réactivité sans faille. Une machine à l'arrêt,
        c'est une pause gâchée. Nous agissons au plus vite pour que l'arrêt ne
        dure jamais.
    - title: Partenariat Durable
      description: >-
        La fidélisation est notre KPI principal. Nous construisons des relations
        long terme basées sur la confiance et la transparence.
