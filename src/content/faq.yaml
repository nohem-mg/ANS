title: "Questions fréquentes"
description: "Les principales réponses sur nos solutions, notre accompagnement et notre manière de travailler."
items:
  - question: "Quelles solutions ANS peut installer dans mon entreprise ?"
    answer: "Nous installons des distributeurs automatiques modernes et fiables, proposant une large gamme de boissons chaudes (café grains, lyophilisé ou capsules, chocolats), boissons fraîches, ainsi qu'une offre snacking variée (confiseries, viennoiseries, sandwichs). Nous proposons également de la petite machine de bureau (Coffee Corner) et des fontaines à eau (réseau ou bonbonne)."
  - question: "Est-ce qu'ANS s'occupe aussi de l'installation et de la maintenance ?"
    answer: "Absolument. Nos équipes gèrent l'installation, l'approvisionnement et la maintenance préventive selon vos besoins. Notre équipe de plus de 30 personnes est dédiée à nos clients au quotidien pour garantir un fonctionnement fluide et sans faille de vos espaces pause."
  - question: "Quels moyens de paiement peuvent être proposés ?"
    answer: "Nous facilitons les paiements grâce à des technologies modernes et adaptables : lecteur de badges, clés, billets, cartes bancaires sans contact, paiement par smartphone, ou encore monnayeur standard. Vous choisissez la solution la plus adaptée aux habitudes de vos collaborateurs."
  - question: "Dans quels environnements intervenez-vous ?"
    answer: "Nous accompagnons les entreprises et administrations (industrie, services, transport, logistique) ainsi que le grand public. Partenaire de proximité en région Hauts-de-France (Nord-Pas-de-Calais, Picardie), nous garantissons des interventions rapides, avec tous nos sites clients situés à moins de 30 minutes de nos techniciens."
  - question: "Qu'est-ce qui différencie ANS d'un prestataire classique ?"
    answer: "Notre force repose sur l'alliance de la proximité et de la réactivité. En tant que membre du réseau indépendant Prodia+, nous allions la puissance d'un réseau national à la souplesse d'un acteur historique du nord. Nous sommes au plus proche de nos clients (la quasi totalité des interventions sont effectuées en moins d'une heure) pour offrir un suivi humain et réactif."
  - question: "Avez-vous une démarche plus responsable ?"
    answer: "Oui, notre engagement durable est profond : cafés labellisés 'Bio' et 'Max Havelaar', matériels économes en énergie, déplacements optimisés, recyclage des matériels en fin de vie, détecteurs de mugs, gobelets en carton, et collecte de notre marc de café revalorisé à 100% en biocombustible."
  - question: "L'offre peut-elle être personnalisée selon notre site ?"
    answer: "Tout à fait. Nous proposons des solutions sur-mesure, notamment avec la charte 'FeelGood' pour varier les plaisirs. Du choix du café (grains, capsules, bio) aux snacks, en passant par le design de machines fiables et l'intégration des meubles, nous adaptons chaque détail à votre environnement."
